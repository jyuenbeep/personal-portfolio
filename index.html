<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jasmine Yuen</title>
  <link rel="icon" type="image/png" href="assets/icon.png?v=1" />
  <link rel="apple-touch-icon" href="assets/icon.png?v=1" />
  <meta name="description" content="Jasmine Yuen — CS student at Georgia Tech and software engineer. Internships at ServiceNow, Ford, and Microsoft." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=1" />
</head>
<body>
  <!-- DESKTOP — wallpaper is set in main.js (WALLPAPER) or by visitors via right-click -->
  <div class="desktop" id="desktop">
    <div class="wallpaper" id="wallpaper"></div>

    <!-- typed-out greeting on the wallpaper (lines live in main.js: GREETINGS) -->
    <div class="greet" aria-hidden="true"><span class="greet__caret-l">❯</span> <span id="greet-text"></span><span class="greet__caret"></span></div>

    <!-- art board widget — pinned to the desktop, windows float over it (pins live in main.js: ARTWORK) -->
    <aside class="widget" id="art-widget" aria-label="Artwork">
      <header class="widget__head">
        <span class="widget__pin" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="13" height="13"><path fill="currentColor" d="M15 3l6 6-2.2.6-3.4 3.4.5 4.6-1.8 1.8-4.2-4.2L4 21l-1-1 5.8-5.9-4.2-4.2L6.4 8.1l4.6.5 3.4-3.4z"/></svg>
        </span>
        <b>art board</b>
        <span class="widget__count" id="art-count"></span>
      </header>
      <div class="widget__scroll" id="art-grid"></div>
    </aside>

    <!-- desktop icons (built in main.js: ICONS) -->
    <div class="icons" id="icons"></div>

    <!-- MENU BAR -->
    <header class="menubar">
      <div class="menubar__left">
        <button class="menubar__apple" id="apple-btn" type="button" aria-label="Menu">
          <svg viewBox="0 0 17 20" width="14" height="16" aria-hidden="true"><path fill="currentColor" d="M14.2 10.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.4.8 1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9 0 0-2.7-1-2.7-4.1zM11.6 3c.7-.9 1.2-2 1.1-3.2-1 0-2.3.7-3 1.6-.7.8-1.2 2-1.1 3.1 1.2.1 2.3-.6 3-1.5z"/></svg>
        </button>
        <b class="menubar__app">Terminal</b>
        <span class="menubar__item">Shell</span>
        <span class="menubar__item">Edit</span>
        <span class="menubar__item">View</span>
        <span class="menubar__item">Window</span>
        <span class="menubar__item">Help</span>
      </div>
      <div class="menubar__right">
        <span class="menubar__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 18.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-4.6-3.1 1.4 1.4a4.5 4.5 0 0 1 6.4 0l1.4-1.4a6.5 6.5 0 0 0-9.2 0zM4.6 12.6 6 14a8.5 8.5 0 0 1 12 0l1.4-1.4a10.5 10.5 0 0 0-14.8 0zM1.8 9.8l1.4 1.4a12.5 12.5 0 0 1 17.6 0l1.4-1.4a14.5 14.5 0 0 0-20.4 0z"/></svg>
        </span>
        <span class="menubar__icon menubar__battery" aria-hidden="true"><i></i></span>
        <span class="menubar__clock" id="clock"></span>
      </div>
      <div class="menu" id="apple-menu" hidden>
        <button type="button" data-action="about">About This Site</button>
        <hr />
        <button type="button" data-action="wallpaper">Change Wallpaper…</button>
        <button type="button" data-action="wallpaper-reset">Reset Wallpaper</button>
        <hr />
        <button type="button" data-action="reopen">Open Terminal</button>
      </div>
    </header>

    <!-- TERMINAL WINDOW -->
    <section class="win" id="win" aria-label="Terminal">
      <div class="win__bar" id="win-bar">
        <span class="win__lights">
          <button class="light light--close" id="btn-close" type="button" aria-label="Close"></button>
          <button class="light light--min" id="btn-min" type="button" aria-label="Minimize"></button>
          <button class="light light--max" id="btn-max" type="button" aria-label="Zoom"></button>
        </span>
        <span class="win__title" id="win-title">jasmine — claude — ~</span>
      </div>
      <div class="term" id="term">
        <div class="term__out" id="out" aria-live="polite"></div>
        <div class="prompt" id="prompt">
          <span class="prompt__caret">&gt;</span>
          <input class="prompt__input" id="input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal input" placeholder='Try "ls", "cat about.md", or ask "where have you interned?"' />
        </div>
        <div class="term__hint" id="hint"><span>? for shortcuts</span><span id="hint-cwd">~</span></div>
      </div>
      <!-- resize handles -->
      <i class="rz rz--n" data-dir="n"></i><i class="rz rz--s" data-dir="s"></i>
      <i class="rz rz--e" data-dir="e"></i><i class="rz rz--w" data-dir="w"></i>
      <i class="rz rz--ne" data-dir="ne"></i><i class="rz rz--nw" data-dir="nw"></i>
      <i class="rz rz--se" data-dir="se"></i><i class="rz rz--sw" data-dir="sw"></i>
    </section>

    <!-- DOCK -->
    <nav class="dock" aria-label="Dock">
      <button class="dock__app" type="button" data-action="reopen" data-label="Terminal" id="dock-term">
        <span class="ic ic--term">&gt;_</span><i class="dock__dot"></i>
      </button>
      <a class="dock__app" href="https://github.com/jyuenbeep" target="_blank" rel="noopener" data-label="GitHub">
        <span class="ic ic--gh"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="M12 .5a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.2.5-2.3 1.2-3.1-.1-.4-.5-1.6.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.7 18.3 5 18.3 5c.6 1.6.2 2.8.1 3.2.8.8 1.2 1.9 1.2 3.1 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .5z"/></svg></span>
      </a>
      <a class="dock__app" href="https://www.linkedin.com/in/jasmineyiyuen/" target="_blank" rel="noopener" data-label="LinkedIn">
        <span class="ic ic--li">in</span>
      </a>
      <a class="dock__app" href="mailto:jasminey023@gmail.com" data-label="Mail">
        <span class="ic ic--mail"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="M3 6.5A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-11zm2 .9v.1l7 4.8 7-4.8v-.1H5zm14 2.5-7 4.7-7-4.7V17h14V9.9z"/></svg></span>
      </a>
      <span class="dock__sep" aria-hidden="true"></span>
      <button class="dock__app" type="button" data-action="wallpaper" data-label="Change Wallpaper">
        <span class="ic ic--photo"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 2v8.6l4-4 3 3 2.5-2.5L19 16.6V7H5zm11 1.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/></svg></span>
      </button>
    </nav>

    <!-- right-click menu on the desktop -->
    <div class="menu menu--ctx" id="ctx-menu" hidden>
      <button type="button" data-action="wallpaper">Change Wallpaper…</button>
      <button type="button" data-action="wallpaper-reset">Reset Wallpaper</button>
      <hr />
      <button type="button" data-action="reopen">Open Terminal</button>
    </div>

    <div class="drop" id="drop" hidden><span>Drop an image to set it as your wallpaper</span></div>
    <input type="file" id="wall-file" accept="image/*" hidden />
  </div>

  <script src="main.js?v=1"></script>
</body>
</html>
